<h2>Liste des formations sans composants enfant</h2>
<ul>
  @for (training of trainingCatalog(); track training.id) {
    <li>
      Nom: {{ training.name }} - NbJours: {{ training.nbDays }}
      <input type="checkbox" [checked]="training.isFree" disabled /> Gratuit
    </li>
  }
</ul>
<h2>Liste des formations avec composants enfant</h2>
<button (click)="ajouter()">Ajouter</button>
<ul>
  @for (training of trainingCatalog(); track $index) {
    <li>
      <app-training-item [training]="training"
       [position]="$index + 1"
        (deleteTraining)="onRemoveTraining($event)" />
      
    </li>
  }
</ul>
