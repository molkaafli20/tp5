<div class="d-flex justify-content-between align-items-center">
  <span>
    <img [src]="pizza().image" class="rounded-circle" width="50" />
    <span class="badge text-bg-dark m-4">{{ pizza().name }}</span>
    @if (pizza().vegetarian) {
      <span class="text-success fw-bold">Pizza végétarienne</span>
    }
  </span>
  <span>
    Prix: {{ pizza().price | number:'2.3-3' }} DT
    <button class="btn btn-dark" (click)="onDelete()">Supprimer</button>
  </span>
</div>
<a href="#">Afficher les commentaires</a>
